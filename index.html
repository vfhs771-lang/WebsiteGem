<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem | Bio Link</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
overflow:hidden;
position:relative;
}

body::before{
content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#00c6ff55,transparent 70%);
top:-250px;
right:-150px;
}

body::after{
content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#ff00ff33,transparent 70%);
bottom:-250px;
left:-150px;
}

.card{
position:relative;
z-index:2;
width:380px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 15px 40px rgba(0,0,0,.45);
text-align:center;
animation:fade 1s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

.avatar{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
box-shadow:0 0 30px #00d4ff;
}

h1{
margin-top:20px;
color:white;
font-size:32px;
font-weight:700;
}

.role{
color:#d7d7d7;
margin-top:8px;
font-size:15px;
}

.phone{
margin-top:18px;
color:#ffffff;
font-size:18px;
font-weight:600;
}

.line{
width:80px;
height:4px;
margin:22px auto;
background:#00d4ff;
border-radius:30px;
}

a{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
padding:15px;
margin:14px 0;
border-radius:14px;
font-size:17px;
font-weight:600;
transition:.3s;
color:white;
}

.facebook{
background:#1877F2;
}

.zalo{
background:#0068FF;
}

.tiktok{
background:#111111;
border:1px solid white;
}

a:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:0 12px 25px rgba(0,0,0,.4);
}

.footer{
margin-top:22px;
font-size:13px;
color:#ddd;
}

.glow{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:#00d4ff;
filter:blur(90px);
opacity:.25;
animation:move 8s infinite alternate;
}

@keyframes move{
from{
transform:translate(-150px,-80px);
}
to{
transform:translate(150px,100px);
}
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card">

<img src="avatar.jpg" class="avatar">

<h1>Lê Quốc Anh (Gem)</h1>

<div class="role">
Welcome to my personal page
</div>

<div class="phone">
📞 0896387698
</div>

<div class="line"></div>

<a class="zalo" href="https://zalo.me/0896387698" target="_blank">
💙 Zalo
</a>

<a class="facebook" href="https://www.facebook.com/quoc.anh.le.352367/" target="_blank">
📘 Facebook
</a>

<a class="tiktok" href="https://www.tiktok.com/@gem2010_0410" target="_blank">
🎵 TikTok
</a>

<div class="footer">
© 2026 • Designed by Gem
</div>

</div>

</body>
</html>

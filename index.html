<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lê Quốc Anh (Gem) | Premium Portfolio</title>
    
    <!-- SEO Meta -->
    <meta name="description" content="Lê Quốc Anh (Gem) - Trang giới thiệu cá nhân chuyên nghiệp. Kết nối với Gem qua Zalo, Facebook, TikTok.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border-radius: 10px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== LOADING SCREEN ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid #00d4ff;
            border-right: 3px solid #7b2ffc;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ===== ANIMATED BACKGROUND ===== */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ===== GLOW CURSOR ===== */
        #cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle, rgba(0,212,255,0.12), rgba(123,47,252,0.06), transparent 70%);
            filter: blur(40px);
            transform: translate(-50%, -50%);
            transition: left 0.1s ease-out, top 0.1s ease-out;
        }

        /* ===== MAIN CARD ===== */
        .card {
            position: relative;
            z-index: 2;
            max-width: 440px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 32px;
            padding: 40px 30px 35px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            animation: cardIn 0.9s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
        }
        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,47,252,0.2), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .brand {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 18px;
            font-weight: 600;
        }
        .brand span {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== AVATAR ===== */
        .avatar-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 18px;
        }
        .avatar-wrap::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #00d4ff);
            background-size: 300% 300%;
            animation: gradSpin 4s linear infinite;
            z-index: -1;
        }
        @keyframes gradSpin {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0a0a0a;
            background: #1a1a1a;
        }

        /* ===== TYPOGRAPHY ===== */
        .name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 60%, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .sub strong {
            color: #00d4ff;
            font-weight: 600;
            -webkit-text-fill-color: #00d4ff;
        }

        .tagline {
            margin: 16px 0 20px;
            font-size: 15px;
            font-weight: 400;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }
        .tagline span {
            color: #fff;
            font-weight: 600;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 50px;
            height: 2px;
            margin: 20px auto 22px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
            border-radius: 4px;
        }

        /* ===== SOCIAL LINKS ===== */
        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .social-link:hover::before {
            opacity: 1;
        }
        .social-link:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .social-link:active {
            transform: scale(0.97);
        }

        .social-link .icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .social-link:hover .icon {
            transform: scale(1.08);
        }

        .social-link .label {
            flex: 1;
            text-align: left;
        }
        .social-link .arrow {
            opacity: 0.3;
            font-size: 18px;
            transition: 0.3s;
        }
        .social-link:hover .arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Brand colors */
        .social-link.zalo .icon { background: #0068ff; }
        .social-link.facebook .icon { background: #1877f2; }
        .social-link.tiktok .icon { background: #111; border: 1px solid rgba(255,255,255,0.15); }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 20px;
        }
        .footer span {
            color: rgba(255,255,255,0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card { padding: 30px 20px 25px; }
            .name { font-size: 24px; }
            .social-link { padding: 14px 18px; font-size: 14px; }
            .social-link .icon { width: 28px; height: 28px; font-size: 16px; }
        }
        @media (max-width: 360px) {
            .avatar-wrap { width: 100px; height: 100px; }
            .card { border-radius: 24px; }
        }

        /* ===== SCROLL ANIMATION (Intersection Observer) ===== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== BADGE RIBBON ===== */
        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(0,212,255,0.10);
            border: 1px solid rgba(0,212,255,0.15);
            color: #00d4ff;
            margin-top: 6px;
        }

        /* ===== PHONE ===== */
        .phone-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin: 6px 0 4px;
            transition: 0.3s;
        }
        .phone-row:hover {
            border-color: rgba(0,212,255,0.2);
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <!-- ===== LOADER ===== -->
    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-ring"></div>
        <div class="loader-text">ĐANG TẢI</div>
    </div>

    <!-- ===== BACKGROUND ===== -->
    <canvas id="bg-canvas"></canvas>

    <!-- ===== CURSOR GLOW ===== -->
    <div id="cursor-glow"></div>

    <!-- ===== MAIN CARD ===== -->
    <main class="card" role="main" aria-label="Profile card">

        <div class="brand"><span>✦</span> GEM PORTFOLIO</div>

        <div class="avatar-wrap reveal">
            <img src="avatar.jpg" alt="Lê Quốc Anh - Gem avatar" loading="eager">
        </div>

        <h1 class="name reveal">Lê Quốc Anh</h1>
        <div class="sub reveal">@ <strong>Gem</strong> · Creator</div>

        <div class="badge reveal">✦ Premium Bio</div>

        <div class="tagline reveal">
            🔥 Chào thằng em đã đến web của <span>anh ba</span> 🔥
        </div>

        <div class="phone-row reveal">
            <span>📞</span> 0896 387 698
        </div>

        <div class="divider reveal"></div>

        <div class="social-grid">
            <a href="https://zalo.me/0896387698" target="_blank" rel="noopener noreferrer" class="social-link zalo reveal">
                <span class="icon">💙</span>
                <span class="label">Zalo</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://www.facebook.com/quoc.anh.le.352367/" target="_blank" rel="noopener noreferrer" class="social-link facebook reveal">
                <span class="icon">📘</span>
                <span class="label">Facebook</span>
                <span class="arrow">→</span>
            </a>
            <a href="https://www.tiktok.com/@gem2010_0410" target="_blank" rel="noopener noreferrer" class="social-link tiktok reveal">
                <span class="icon">🎵</span>
                <span class="label">TikTok</span>
                <span class="arrow">→</span>
            </a>
        </div>

        <div class="footer reveal">
            © 2026 · Designed by <span>Lê Quốc Anh (Gem)</span>
        </div>
    </main>

    <script>
        // ===== LOADER =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 600);
        });

        // ===== PARTICLE BACKGROUND =====
        (function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 140; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2 + 0.8,
                    dx: (Math.random() - 0.5) * 0.5,
                    dy: (Math.random() - 0.5) * 0.5,
                    o: Math.random() * 0.6 + 0.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.o})`;
                    ctx.fill();
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0 || p.x > w) p.dx *= -1;
                    if (p.y < 0 || p.y > h) p.dy *= -1;
                }
                // Draw connections
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255,255,255,${0.08 * (1 - dist / 110)})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ===== CURSOR GLOW =====
        (function cursorGlow() {
            const glow = document.getElementById('cursor-glow');
            let x = -200,
                y = -200;
            document.addEventListener('mousemove', (e) => {
                x = e.clientX;
                y = e.clientY;
                glow.style.left = x + 'px';
                glow.style.top = y + 'px';
            });
        })();

        // ===== INTERSECTION OBSERVER (Reveal) =====
        (function revealOnScroll() {
            const els = document.querySelectorAll('.reveal');
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -30px 0px'
            });
            els.forEach(el => obs.observe(el));
            // Also trigger after load for items already visible
            setTimeout(() => {
                els.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight) {
                        el.classList.add('visible');
                    }
                });
            }, 400);
        })();
    </script>

</body>
</html>

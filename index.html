<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lê Quốc Anh (Gem) | Premium Portfolio</title>
    
    <!-- SEO Meta -->
    <meta name="description" content="Lê Quốc Anh (Gem) - Trang giới thiệu cá nhân chuyên nghiệp. Kết nối với Gem qua Zalo, Facebook, TikTok.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border-radius: 10px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.light-mode {
            background: #f0f2f5;
            color: #1a1a1a;
        }
        body.light-mode .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(24px) saturate(1.6);
            border-color: rgba(0,0,0,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.15);
        }
        body.light-mode .card::before {
            background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(123,47,252,0.2), transparent 60%);
        }
        body.light-mode .brand { color: rgba(0,0,0,0.3); }
        body.light-mode .name {
            background: linear-gradient(135deg, #1a1a1a 60%, rgba(0,0,0,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light-mode .sub { color: rgba(0,0,0,0.4); }
        body.light-mode .tagline { color: rgba(0,0,0,0.5); }
        body.light-mode .tagline span { color: #1a1a1a; }
        body.light-mode .phone-row {
            background: rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.06);
            color: rgba(0,0,0,0.6);
        }
        body.light-mode .phone-row:hover {
            border-color: rgba(0,212,255,0.3);
            background: rgba(0,0,0,0.06);
        }
        body.light-mode .social-link {
            background: rgba(0,0,0,0.03);
            border-color: rgba(0,0,0,0.06);
            color: #1a1a1a;
        }
        body.light-mode .social-link:hover {
            border-color: rgba(0,0,0,0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }
        body.light-mode .social-link::before {
            background: linear-gradient(135deg, rgba(0,0,0,0.04), transparent 60%);
        }
        body.light-mode .footer { color: rgba(0,0,0,0.2); border-color: rgba(0,0,0,0.04); }
        body.light-mode .footer span { color: rgba(0,0,0,0.3); }
        body.light-mode .badge {
            background: rgba(0,212,255,0.12);
            border-color: rgba(0,212,255,0.2);
        }
        body.light-mode .divider {
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
        }
        body.light-mode ::-webkit-scrollbar-track { background: #f0f2f5; }
        body.light-mode .counter-box {
            background: rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.06);
            color: rgba(0,0,0,0.6);
        }
        body.light-mode .time-location {
            background: rgba(0,0,0,0.04);
            border-color: rgba(0,0,0,0.06);
            color: rgba(0,0,0,0.6);
        }

        /* ===== LOADING SCREEN ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top: 3px solid #00d4ff;
            border-right: 3px solid #7b2ffc;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ===== ANIMATED BACKGROUND ===== */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ===== GLOW CURSOR ===== */
        #cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(circle, rgba(0,212,255,0.12), rgba(123,47,252,0.06), transparent 70%);
            filter: blur(40px);
            transform: translate(-50%, -50%);
            transition: left 0.1s ease-out, top 0.1s ease-out;
        }

        /* ===== TOP TOOLBAR ===== */
        .top-toolbar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .tool-btn {
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .tool-btn:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        body.light-mode .tool-btn {
            background: rgba(0,0,0,0.05);
            border-color: rgba(0,0,0,0.08);
            color: #1a1a1a;
        }
        body.light-mode .tool-btn:hover {
            background: rgba(0,0,0,0.1);
        }
        .tool-btn .flag {
            font-size: 18px;
        }

        /* ===== MAIN CARD ===== */
        .card {
            position: relative;
            z-index: 2;
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 32px;
            padding: 40px 30px 35px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
            text-align: center;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
            animation: cardIn 0.9s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,47,252,0.2), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        .brand {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 18px;
            font-weight: 600;
            transition: color 0.5s ease;
        }
        .brand span {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== AVATAR ===== */
        .avatar-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 18px;
        }
        .avatar-wrap::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #00d4ff);
            background-size: 300% 300%;
            animation: gradSpin 4s linear infinite;
            z-index: -1;
        }
        @keyframes gradSpin {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0a0a0a;
            background: #1a1a1a;
        }

        /* ===== TYPOGRAPHY ===== */
        .name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 60%, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-height: 40px;
            transition: background 0.5s ease;
        }
        .sub {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            letter-spacing: 0.3px;
            transition: color 0.5s ease;
        }
        .sub strong {
            color: #00d4ff;
            font-weight: 600;
            -webkit-text-fill-color: #00d4ff;
        }

        .tagline {
            margin: 16px 0 20px;
            font-size: 15px;
            font-weight: 400;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
            transition: color 0.5s ease;
        }
        .tagline span {
            color: #fff;
            font-weight: 600;
            transition: color 0.5s ease;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 50px;
            height: 2px;
            margin: 20px auto 22px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.4), transparent);
            border-radius: 4px;
            transition: background 0.5s ease;
        }

        /* ===== COUNTER ===== */
        .counter-box {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 12px 0 16px;
            padding: 12px 20px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.5s ease;
        }
        .counter-item {
            text-align: center;
        }
        .counter-item .number {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .counter-item .label {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
            transition: color 0.5s ease;
        }

        /* ===== TIME/LOCATION ===== */
        .time-location {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 10px 0 14px;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            transition: all 0.5s ease;
        }
        .time-location i {
            margin-right: 6px;
            color: #00d4ff;
        }

        /* ===== SOCIAL LINKS ===== */
        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .social-link:hover::before {
            opacity: 1;
        }
        .social-link:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .social-link:active {
            transform: scale(0.97);
        }

        .social-link .icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .social-link:hover .icon {
            transform: scale(1.08);
        }

        .social-link .label {
            flex: 1;
            text-align: left;
        }
        .social-link .arrow {
            opacity: 0.3;
            font-size: 18px;
            transition: 0.3s;
        }
        .social-link:hover .arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Brand colors */
        .social-link.zalo .icon { background: #0068ff; }
        .social-link.facebook .icon { background: #1877f2; }
        .social-link.tiktok .icon { background: #111; border: 1px solid rgba(255,255,255,0.15); }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 20px;
            transition: all 0.5s ease;
        }
        .footer span {
            color: rgba(255,255,255,0.3);
            transition: color 0.5s ease;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card { padding: 30px 20px 25px; }
            .name { font-size: 24px; }
            .social-link { padding: 14px 18px; font-size: 14px; }
            .social-link .icon { width: 28px; height: 28px; font-size: 16px; }
            .top-toolbar { top: 10px; right: 10px; gap: 6px; }
            .tool-btn { padding: 8px 12px; font-size: 12px; }
            .counter-box { gap: 16px; padding: 10px 14px; }
            .counter-item .number { font-size: 18px; }
            .time-location { font-size: 12px; gap: 10px; padding: 8px 14px; }
        }
        @media (max-width: 360px) {
            .avatar-wrap { width: 100px; height: 100px; }
            .card { border-radius: 24px; }
        }

        /* ===== SCROLL ANIMATION ===== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== BADGE ===== */
        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(0,212,255,0.10);
            border: 1px solid rgba(0,212,255,0.15);
            color: #00d4ff;
            margin-top: 6px;
            transition: all 0.5s ease;
        }

        /* ===== PHONE ===== */
        .phone-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin: 6px 0 4px;
            transition: all 0.3s ease;
        }
        .phone-row:hover {
            border-color: rgba(0,212,255,0.2);
            background: rgba(255,255,255,0.06);
        }

        /* ===== FLOATING ACTION BUTTON ===== */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            color: #fff;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,212,255,0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .fab:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,212,255,0.6);
        }
        .fab:active {
            transform: scale(0.95);
        }
        .fab .tooltip {
            position: absolute;
            right: 70px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            color: #fff;
            font-weight: 500;
        }
        .fab:hover .tooltip {
            opacity: 1;
        }

        /* ===== AUDIO PLAYER ===== */
        .audio-player {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 98;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 8px 16px 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .audio-player:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }
        .audio-player button {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            transition: 0.3s;
        }
        .audio-player button:hover {
            transform: scale(1.15);
            color: #00d4ff;
        }
        .audio-player input[type="range"] {
            width: 60px;
            accent-color: #00d4ff;
            background: transparent;
            cursor: pointer;
        }
        body.light-mode .audio-player {
            background: rgba(0,0,0,0.05);
            border-color: rgba(0,0,0,0.08);
        }
        body.light-mode .audio-player button {
            color: #1a1a1a;
        }
        @media (max-width: 480px) {
            .fab { width: 50px; height: 50px; font-size: 22px; bottom: 20px; right: 20px; }
            .audio-player { bottom: 80px; right: 20px; padding: 6px 12px 6px 8px; }
            .audio-player input[type="range"] { width: 40px; }
        }
    </style>
</head>

    <!-- ===== LOADER ===== -->
    <div id="loader" role="status" aria-label="Loading">
        <div class="loader-ring"></div>
        <div class="loader-text" data-en="LOADING" data-vi="ĐANG TẢI">ĐANG TẢI</div>

    <!-- ===== BACKGROUND ===== -->
    <canvas id="bg-canvas"></canvas>

    <!-- ===== CURSOR GLOW ===== -->

        </button>
    </div>

    <!-- ===== FLOATING ACTION BUTTON ===== -->

        <span class="tooltip" data-en="Contact Now" data-vi="Liên hệ ngay">Liên hệ ngay</span>

    <div class="audio-player" id="audioPlayer">

        <button id="muteBtn"><i class="fas fa-volume-up"></i></button>
    </div>

    <!-- ===== MAIN CARD ===== -->
    <main class="card" role="main" aria-label="Profile card">

        <div class="brand"><span>✦</span> <span data-en="GEM PORTFOLIO" data-vi="GEM PORTFOLIO">GEM PORTFOLIO</span></div>

        <div class="avatar-wrap reveal">
            <img src="avatar.jpg" alt="Lê Quốc Anh - Gem avatar" loading="eager">
        </div>

        <h1 class="name reveal" id="typingText">Lê Quốc Anh</h1>
        <div class="sub reveal">@ <strong>Gem</strong> · <span data-en="Creator" data-vi="Creator">Creator</span></div>

        <div class="badge reveal">✦ <span data-en="Premium Bio" data-vi="Premium Bio">Premium Bio</span></div>

        <div class="tagline reveal">
            🔥 <span data-en="Welcome to my website" data-vi="Chào thằng em đã đến web của">Chào thằng em đã đến web của</span> <span>anh ba</span> 🔥
        </div>

        <div class="phone-row reveal">
            <span>📞</span> 0896 387 698
        </div>

    <script>
        // ============================================================
        // 1. LOADER
        // ============================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 600);
        });

        // ============================================================
        // 2. PARTICLE BACKGROUND
        // ============================================================
        (function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < 140; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 2 + 0.8,
                    dx: (Math.random() - 0.5) * 0.5,
                    dy: (Math.random() - 0.5) * 0.5,
                    o: Math.random() * 0.6 + 0.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.o})`;
                    ctx.fill();
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0 || p.x > w) p.dx *= -1;
                    if (p.y < 0 || p.y > h) p.dy *= -1;
                }
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255,255,255,${0.08 * (1 - dist / 110)})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ============================================================
        // 3. CURSOR GLOW
        // ============================================================
        (function cursorGlow() {
            const glow = document.getElementById('cursor-glow');
            let x = -200, y = -200;
            document.addEventListener('mousemove', (e) => {
                x = e.clientX;
                y = e.clientY;
                glow.style.left = x + 'px';
                glow.style.top = y + 'px';
            });
        })();

        // ============================================================
        // 4. INTERSECTION OBSERVER (Reveal)
        // ============================================================
        (function revealOnScroll() {
            const els = document.querySelectorAll('.reveal');
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -30px 0px'
            });
            els.forEach(el => obs.observe(el));
            setTimeout(() => {
                els.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight) {
                        el.classList.add('visible');
                    }
                });
            }, 400);
        })();

        // ============================================================
        // 5. TYPING EFFECT
        // ============================================================
        (function typingEffect() {
            const el = document.getElementById('typingText');
            const fullText = "Lê Quốc Anh";
            let idx = 0;
            el.textContent = '';
            function type() {
                if (idx < fullText.length) {
                    el.textContent += fullText.charAt(idx);
                    idx++;
                    setTimeout(type, 120);
                }
            }
            setTimeout(type, 1000);
        })();

        // ============================================================
        // 6. DARK/LIGHT MODE TOGGLE
        // ============================================================
        (function themeToggle() {
            const btn = document.getElementById('themeToggle');
            const icon = btn.querySelector('i');
            let isDark = true;

            btn.addEventListener('click', () => {
                isDark = !isDark;
                document.body.classList.toggle('light-mode', !isDark);
                icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
                // Update scrollbar
                document.querySelector('::-webkit-scrollbar-track').style.background = isDark ? '#0a0a0a' : '#f0f2f5';
            });
        })();

        // ============================================================
        // 7. LANGUAGE TOGGLE (EN/VN)
        // ============================================================
        (function langToggle() {
            const btn = document.getElementById('langToggle');
            const flag = btn.querySelector('.flag');
            const label = document.getElementById('langLabel');
            let isVI = true;

            function updateLanguage(lang) {
                document.querySelectorAll('[data-en][data-vi]').forEach(el => {
                    el.textContent = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-vi');
                });
                // Update tooltip
                const tooltip = document.querySelector('.fab .tooltip');
                if (tooltip) {
                    tooltip.textContent = lang === 'en' ? tooltip.getAttribute('data-en') : tooltip.getAttribute('data-vi');
                }
                // Update loader text
                const loaderText = document.querySelector('.loader-text');
                if (loaderText) {
                    loaderText.textContent = lang === 'en' ? loaderText.getAttribute('data-en') : loaderText.getAttribute('data-vi');
                }
            }

            btn.addEventListener('click', () => {
                isVI = !isVI;
                flag.textContent = isVI ? '🇻🇳' : '🇬🇧';
                label.textContent = isVI ? 'VI' : 'EN';
                updateLanguage(isVI ? 'vi' : 'en');
            });
        })();

        // ============================================================
        // 8. COUNTER (Visits + Online)
        // ============================================================
        (function counter() {
            // Simple mock counter - in real use, you'd use a backend or localStorage
            let visits = parseInt(localStorage.getItem('gemVisits') || '0');
            visits++;
            localStorage.setItem('gemVisits', visits);
            document.getElementById('visitCount').textContent = visits;

            // Online count (simulated)
            let online = Math.floor(Math.random() * 15) + 3;
            document.getElementById('onlineCount').textContent = online;

            // Update online count every 30s
            setInterval(() => {
                online = Math.floor(Math.random() * 15) + 3;
                document.getElementById('onlineCount').textContent = online;
            }, 30000);
        })();

        // ============================================================
        // 9. TIME & LOCATION
        // ============================================================
        (function timeLocation() {
            const timeEl = document.getElementById('currentTime');
            const locEl = document.getElementById('userLocation');

            function updateTime() {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
            }
            updateTime();
            setInterval(updateTime, 1000);

            // Get location from IP API
            fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .then(data => {
                    if (data.city && data.country_name) {
                        locEl.textContent = `${data.city}, ${data.country_name}`;
                    } else {
                        locEl.textContent = 'Việt Nam';
                    }
                })
                .catch(() => {
                    locEl.textContent = 'Việt Nam';
                });
        })();

        // ============================================================
        // 10. AUDIO PLAYER (Background music)
        // ============================================================
        (function audioPlayer() {
            const playBtn = document.getElementById('playBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const muteBtn = document.getElementById('muteBtn');
            let audio = null;
            let isPlaying = false;
            let isMuted = false;

            // Create audio context and oscillator (simple beep/bgm)
            // For real music, you'd use an <audio> element with a file URL
            // This is a simple synth tone as placeholder
            let audioCtx = null;
            let oscillator = null;
            let gainNode = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = volumeSlider.value * 0.3;
                    gainNode.connect(audioCtx.destination);
                }
            }

            function playTone() {
                initAudio();
                if (oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                oscillator = audioCtx.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.value = 220;
                oscillator.connect(gainNode);
                oscillator.start();
                // Auto stop after 2s to create a loop effect
                setTimeout(() => {
                    if (oscillator && isPlaying) {
                        oscillator.stop();
                        oscillator.disconnect();
                        oscillator = null;
                        // Restart after short pause
                        setTimeout(playTone, 500);
                    }
                }, 2000);
            }

            playBtn.addEventListener('click', () => {
                initAudio();
                if (isPlaying) {
                    isPlaying = false;
                    if (oscillator) {
                        oscillator.stop();
                        oscillator.disconnect();
                        oscillator = null;
                    }
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    playTone();
                }
            });

            volumeSlider.addEventListener('input', () => {
                if (gainNode) {
                    gainNode.gain.value = volumeSlider.value * 0.3;
                }
                if (isMuted) {
                    isMuted = false;
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            });

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (gainNode) {
                    gainNode.gain.value = isMuted ? 0 : volumeSlider.value * 0.3;
                }
                muteBtn.innerHTML = isMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
            });

            // Autoplay attempt (user interaction required for most browsers)
            document.addEventListener('click', () => {
                initAudio();
                if (!isPlaying) {
                    // Try autoplay on first click
                }
            }, { once: true });
        })();

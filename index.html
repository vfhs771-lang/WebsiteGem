<script>
const c=document.getElementById('p'),x=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
let a=[...Array(180)].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+1,s:Math.random()*2+1}));
(function f(){x.clearRect(0,0,c.width,c.height);x.fillStyle="rgba(255,255,255,.9)";
for(let p of a){x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill();p.y+=p.s;p.x+=Math.sin(p.y/40)*.3;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}}
requestAnimationFrame(f)})();
</script>

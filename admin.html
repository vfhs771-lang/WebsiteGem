<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Key | GEM STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root { --bg: #050811; --main: #00d4ff; --text: #fff; --sub: #cfd8e3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', Arial, sans-serif; }
        body { background: linear-gradient(180deg, #050811, #0b1327); color: var(--text); min-height: 100vh; padding: 30px; }
        .container { max-width: 750px; margin: 0 auto; }
        h1 { text-align: center; color: var(--main); font-size: 32px; margin-bottom: 30px; text-shadow: 0 0 30px rgba(0,212,255,0.5); }
        .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .card h2 { color: var(--main); margin-bottom: 15px; font-size: 20px; }
        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        button { padding: 12px 22px; border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; transition: .2s; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-1d { background: #f39c12; }
        .btn-7d { background: #2ecc71; }
        .btn-30d { background: #3498db; }
        .btn-100y { background: #9b59b6; }
        .btn-copy { background: var(--main); color: #000; }
        .btn-delete { background: #e74c3c; font-size: 12px; padding: 6px 12px; }
        .btn-reset { background: #e67e22; font-size: 12px; padding: 6px 12px; }
        input, select { padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: #fff; font-size: 14px; }
        select option { background: #0b1327; color: #fff; }
        .key-display { background: rgba(0,0,0,.4); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--main); margin: 15px 0; }
        .key-display code { font-size: 22px; color: var(--main); word-break: break-all; }
        .key-info { color: var(--sub); margin: 10px 0; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 13px; }
        th { color: var(--main); }
        .toast { position: fixed; top: 20px; right: 20px; background: #2ecc71; color: #fff; padding: 15px 25px; border-radius: 10px; z-index: 999; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-single { background: #e74c3c; color: #fff; }
        .badge-multi { background: #2ecc71; color: #fff; }
        .logout-btn { float: right; background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 QUẢN LÝ LICENSE KEY</h1>

        <!-- CẤU HÌNH GITHUB -->
        <div class="card" id="configCard">
            <h2>⚙️ Cấu hình GitHub (Lần đầu)</h2>
            <input type="text" id="githubUser" placeholder="Username GitHub" style="width:100%;margin-bottom:10px;">
            <input type="text" id="githubRepo" placeholder="Tên repo (vd: gemstudio)" style="width:100%;margin-bottom:10px;">
            <input type="password" id="githubToken" placeholder="Token GitHub (ghp_...)" style="width:100%;margin-bottom:10px;">
            <button class="btn-copy" onclick="saveConfig()">💾 Lưu cấu hình</button>
        </div>

        <!-- TẠO KEY -->
        <div class="card" id="mainCard" style="display:none;">
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đổi config</button>
            <h2>⚡ Tạo Key Nhanh</h2>
            
            <!-- CHỌN LOẠI KEY -->
            <div style="margin-bottom:15px;">
                <label style="margin-right:15px;font-weight:bold;">🔒 Loại key:</label>
                <select id="deviceType" style="width:200px;">
                    <option value="single">📱 1 Thiết Bị</option>
                    <option value="multi">💻 Nhiều Thiết Bị</option>
                </select>
            </div>
            
            <div class="btn-row">
                <button class="btn-1d" onclick="generateKey(1)">📅 1 Ngày</button>
                <button class="btn-7d" onclick="generateKey(7)">📅 7 Ngày</button>
                <button class="btn-30d" onclick="generateKey(30)">📅 30 Ngày</button>
                <button class="btn-100y" onclick="generateKey(36500)">♾️ 100 Năm</button>
            </div>
            <div id="keyResult"></div>

            <!-- TẠO KEY TÙY CHỈNH -->
            <h2 style="margin-top:20px;">🎨 Tạo Key Tùy Chỉnh</h2>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <input type="text" id="customKeyName" placeholder="Tên key (bỏ trống = tự sinh)" style="flex:1;min-width:200px;">
                <input type="number" id="customDays" value="30" min="1" style="width:80px;">
                <select id="customDeviceType">
                    <option value="single">📱 1 TB</option>
                    <option value="multi">💻 Nhiều TB</option>
                </select>
                <button class="btn-copy" onclick="generateCustomKey()">✨ Tạo</button>
            </div>
            <div id="customKeyResult"></div>
            
            <!-- DANH SÁCH KEY -->
            <h2 style="margin-top:20px;">📋 Danh Sách Key</h2>
            <button class="btn-copy" onclick="loadKeys()" style="margin-bottom:10px;">🔄 Tải lại</button>
            <div id="keyList"></div>
        </div>
    </div>

    <script>
        // ========== CONFIG ==========
        function saveConfig() {
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const token = document.getElementById('githubToken').value.trim();
            
            if (!user || !repo || !token) { alert('Điền đầy đủ thông tin!'); return; }
            
            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);
            
            document.getElementById('configCard').style.display = 'none';
            document.getElementById('mainCard').style.display = 'block';
            loadKeys();
            showToast('✅ Đã lưu cấu hình!');
        }

        function logout() {
            localStorage.removeItem('gh_user');
            localStorage.removeItem('gh_repo');
            localStorage.removeItem('gh_token');
            location.reload();
        }

        (function() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            if (user && repo && token) {
                document.getElementById('githubUser').value = user;
                document.getElementById('githubRepo').value = repo;
                document.getElementById('githubToken').value = token;
                document.getElementById('configCard').style.display = 'none';
                document.getElementById('mainCard').style.display = 'block';
                loadKeys();
            }
        })();

        function getConfig() {
            return {
                user: localStorage.getItem('gh_user'),
                repo: localStorage.getItem('gh_repo'),
                token: localStorage.getItem('gh_token')
            };
        }

        function getApiUrl() {
            const cfg = getConfig();
            return `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/keys.json`;
        }

        // ========== HELPERS ==========
        function randomKey() {
            const deviceType = document.getElementById('deviceType').value;
            const prefix = deviceType === 'single' ? 'BAKHIA-1-' : 'BAKHIA-M-';
            return prefix + Math.random().toString(36).substring(2, 14).toUpperCase();
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            showToast('📋 Đã copy: ' + text);
        }

        // ========== TẠO KEY ==========
        async function generateKey(days) {
            const deviceType = document.getElementById('deviceType').value;
            const key = randomKey();
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + days);
            const expiryStr = expiry.toISOString().split('T')[0];
            
            await saveKey(key, deviceType, expiryStr);
            
            document.getElementById('keyResult').innerHTML = `
                <div class="key-display">
                    <p style="color:var(--sub);">🎉 Key mới đã tạo:</p>
                    <code>${key}</code>
                    <p class="key-info">
                        🔒 Loại: <b>${deviceType === 'single' ? '1 Thiết Bị' : 'Nhiều Thiết Bị'}</b> | 
                        ⏰ Hết hạn: ${expiry.toLocaleDateString('vi-VN')} | 
                        📅 ${days} ngày
                    </p>
                    <button class="btn-copy" onclick="copyText('${key}')">📋 Copy Key</button>
                </div>`;
            
            showToast('✅ Đã tạo key!');
            loadKeys();
        }

        async function generateCustomKey() {
            let keyName = document.getElementById('customKeyName').value.trim();
            const days = parseInt(document.getElementById('customDays').value) || 30;
            const deviceType = document.getElementById('customDeviceType').value;
            
            if (!keyName) {
                const prefix = deviceType === 'single' ? 'BAKHIA-1-' : 'BAKHIA-M-';
                keyName = prefix + Math.random().toString(36).substring(2, 14).toUpperCase();
            }
            
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + days);
            const expiryStr = expiry.toISOString().split('T')[0];
            
            await saveKey(keyName, deviceType, expiryStr);
            
            document.getElementById('customKeyResult').innerHTML = `
                <div class="key-display">
                    <code>${keyName}</code>
                    <p class="key-info">
                        🔒 Loại: <b>${deviceType === 'single' ? '1 Thiết Bị' : 'Nhiều Thiết Bị'}</b> | 
                        ⏰ ${expiry.toLocaleDateString('vi-VN')} | 
                        📅 ${days} ngày
                    </p>
                    <button class="btn-copy" onclick="copyText('${keyName}')">📋 Copy Key</button>
                </div>`;
            showToast('✅ Đã tạo key!');
            loadKeys();
        }

        async function saveKey(key, deviceType, expiry) {
            const cfg = getConfig();
            
            // Tải keys.json hiện tại
            const response = await fetch(getApiUrl(), {
                headers: { 'Authorization': `token ${cfg.token}` }
            });
            const data = await response.json();
            const content = atob(data.content);
            const keys = JSON.parse(content);
            
            // Thêm key mới
            keys[key] = {
                plan: 'premium',
                device: deviceType,
                hwid: (deviceType === 'single') ? null : 'unlimited',
                expiry: expiry
            };
            
            // Upload lên GitHub
            const newContent = btoa(JSON.stringify(keys, null, 2));
            await fetch(getApiUrl(), {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Thêm key: ${key} (${deviceType})`,
                    content: newContent,
                    sha: data.sha
                })
            });
        }

        // ========== LOAD KEYS ==========
        async function loadKeys() {
            try {
                const cfg = getConfig();
                const response = await fetch(getApiUrl(), {
                    headers: { 'Authorization': `token ${cfg.token}` }
                });
                const data = await response.json();
                const content = atob(data.content);
                const keys = JSON.parse(content);
                
                let html = '<table><tr><th>Key</th><th>Loại</th><th>HWID</th><th>Hết hạn</th><th>Còn</th><th>Xóa</th><th>Reset</th></tr>';
                
                for (const [key, info] of Object.entries(keys)) {
                    const expiry = new Date(info.expiry);
                    const daysLeft = Math.ceil((expiry - new Date()) / 86400000);
                    const status = daysLeft <= 0 ? '🔴' : daysLeft <= 7 ? '🟡' : '🟢';
                    const deviceLabel = info.device === 'single' 
                        ? '<span class="badge badge-single">📱 1 TB</span>' 
                        : '<span class="badge badge-multi">💻 Nhiều TB</span>';
                    const hwidInfo = info.device === 'single' 
                        ? (info.hwid && info.hwid !== 'null' ? '🔒 Đã khóa' : '🔓 Chưa dùng') 
                        : '♾️ Không giới hạn';
                    
                    html += `<tr>
                        <td><code style="font-size:11px;">${key}</code></td>
                        <td>${deviceLabel}</td>
                        <td style="font-size:11px;">${hwidInfo}</td>
                        <td>${expiry.toLocaleDateString('vi-VN')}</td>
                        <td>${status} ${daysLeft} ngày</td>
                        <td><button class="btn-delete" onclick="deleteKey('${key}')">🗑️</button></td>
                        <td>${info.device === 'single' ? `<button class="btn-reset" onclick="resetHWID('${key}')">🔄</button>` : '-'}</td>
                    </tr>`;
                }
                html += '</table>';
                document.getElementById('keyList').innerHTML = html || '<p>Chưa có key nào.</p>';
            } catch (e) {
                document.getElementById('keyList').innerHTML = '<p style="color:#e74c3c;">Lỗi tải key</p>';
            }
        }

        // ========== XÓA KEY ==========
        async function deleteKey(key) {
            if (!confirm('Xóa key: ' + key + '?')) return;
            
            const cfg = getConfig();
            const response = await fetch(getApiUrl(), {
                headers: { 'Authorization': `token ${cfg.token}` }
            });
            const data = await response.json();
            const content = atob(data.content);
            const keys = JSON.parse(content);
            
            delete keys[key];
            
            const newContent = btoa(JSON.stringify(keys, null, 2));
            await fetch(getApiUrl(), {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Xóa key: ${key}`,
                    content: newContent,
                    sha: data.sha
                })
            });
            
            showToast('🗑️ Đã xóa key!');
            loadKeys();
        }

        // ========== RESET HWID ==========
        async function resetHWID(key) {
            if (!confirm('Reset HWID cho key: ' + key + '?\n(Khách có thể dùng máy khác)')) return;
            
            const cfg = getConfig();
            const response = await fetch(getApiUrl(), {
                headers: { 'Authorization': `token ${cfg.token}` }
            });
            const data = await response.json();
            const content = atob(data.content);
            const keys = JSON.parse(content);
            
            if (keys[key]) {
                keys[key].hwid = null;
            }
            
            const newContent = btoa(JSON.stringify(keys, null, 2));
            await fetch(getApiUrl(), {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Reset HWID: ${key}`,
                    content: newContent,
                    sha: data.sha
                })
            });
            
            showToast('🔄 Đã reset HWID!');
            loadKeys();
        }
    </script>
</body>
</html>
